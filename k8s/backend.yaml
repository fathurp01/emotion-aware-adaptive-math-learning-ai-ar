apiVersion: apps/v1
kind: Deployment
metadata:
  name: adaptive-math-backend
  namespace: default
  labels:
    app: adaptive-math-backend
spec:
  replicas: 2
  selector:
    matchLabels:
      app: adaptive-math-backend
  template:
    metadata:
      labels:
        app: adaptive-math-backend
    spec:
      containers:
        - name: backend
          image: yourusername/adaptive-math-backend:latest
          ports:
            - containerPort: 5000
          env:
            - name: DATABASE_URL
              value: "mysql://root:password@mysql-service:3306/emotion_learning_db"
            - name: NVIDIA_API_KEY
              value: "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"
            - name: AUTH_SECRET
              value: "8b9d311fa67702f2053676c8c4c795bb4f895c010d8a4ba1"
            - name: MATERIAL_PRECOMPUTE_ON_STARTUP
              value: "1"
          resources:
            requests:
              memory: "256Mi"
              cpu: "100m"
            limits:
              memory: "512Mi"
              cpu: "500m"
---
apiVersion: v1
kind: Service
metadata:
  name: backend-service
  namespace: default
spec:
  selector:
    app: adaptive-math-backend
  ports:
    - protocol: TCP
      port: 5000
      targetPort: 5000
  type: ClusterIP
---
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: backend-hpa
  namespace: default
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: adaptive-math-backend
  minReplicas: 2
  maxReplicas: 10
  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: 75
