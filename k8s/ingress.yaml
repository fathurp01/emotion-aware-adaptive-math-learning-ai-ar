apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: adaptive-learning-ingress
  namespace: default
  annotations:
    kubernetes.io/ingress.class: nginx
    nginx.ingress.kubernetes.io/ssl-redirect: "false"
spec:
  rules:
    - http:
        paths:
          # Frontend Route (acts as main entryway, handles internal API rewrites to backend)
          - path: /
            pathType: Prefix
            backend:
              service:
                name: frontend-service
                port:
                  number: 3000
