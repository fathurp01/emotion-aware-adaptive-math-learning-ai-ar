name: CI/CD Pipeline

on:
  push:
    branches: [ "main", "cloud" ]
  pull_request:
    branches: [ "main", "cloud" ]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: |
            backend/package-lock.json
            frontend/package-lock.json

      - name: Test Backend Build
        run: |
          cd backend
          npm ci
          npx prisma generate
          npm run build

      - name: Test Frontend Build
        run: |
          cd frontend
          npm ci
          npm run build

  dockerize:
    needs: test
    runs-on: ubuntu-latest
    if: github.event_name == 'push'
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Build and Push Backend Image
        uses: docker/build-push-action@v5
        with:
          context: ./backend
          file: ./backend/Dockerfile
          push: true
          tags: |
            ${{ secrets.DOCKER_USERNAME }}/adaptive-math-backend:latest
            ${{ secrets.DOCKER_USERNAME }}/adaptive-math-backend:${{ github.sha }}

      - name: Build and Push Frontend Image
        uses: docker/build-push-action@v5
        with:
          context: ./frontend
          file: ./frontend/Dockerfile
          push: true
          tags: |
            ${{ secrets.DOCKER_USERNAME }}/adaptive-math-frontend:latest
            ${{ secrets.DOCKER_USERNAME }}/adaptive-math-frontend:${{ github.sha }}

  deploy:
    needs: dockerize
    runs-on: ubuntu-latest
    if: github.event_name == 'push'
    steps:
      - name: Deploy to Cloud (EC2)
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USERNAME }}
          key: ${{ secrets.EC2_SSH_KEY }}
          script: |
            cd /app/emotion-aware-adaptive-math-learning-ai-ar
            # Pull latest code and images
            git pull origin cloud
            docker compose pull
            # Restart services
            docker compose down
            docker compose up -d
            # Run database migrations/seeding
            docker compose exec -T backend npx prisma db push
            docker compose exec -T backend npx prisma db seed
