name: CI/CD Pipeline

on:
  push:
    branches: [ "main", "cloud" ]
  pull_request:
    branches: [ "main", "cloud" ]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: |
            backend/package-lock.json
            frontend/package-lock.json

      - name: Test Backend Build
        run: |
          cd backend
          npm ci
          npx prisma generate
          npm run build

      - name: Test Frontend Build
        run: |
          cd frontend
          npm ci
          npm run build

  dockerize:
    needs: test
    runs-on: ubuntu-latest
    if: github.event_name == 'push'
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Build and Push Backend Image
        uses: docker/build-push-action@v5
        with:
          context: ./backend
          file: ./backend/Dockerfile
          push: true
          tags: |
            ${{ secrets.DOCKER_USERNAME }}/adaptive-math-backend:latest
            ${{ secrets.DOCKER_USERNAME }}/adaptive-math-backend:${{ github.sha }}

      - name: Build and Push Frontend Image
        uses: docker/build-push-action@v5
        with:
          context: ./frontend
          file: ./frontend/Dockerfile
          push: true
          tags: |
            ${{ secrets.DOCKER_USERNAME }}/adaptive-math-frontend:latest
            ${{ secrets.DOCKER_USERNAME }}/adaptive-math-frontend:${{ github.sha }}

  deploy:
    needs: dockerize
    runs-on: ubuntu-latest
    if: github.event_name == 'push'
    steps:
      - name: Deploy Backend to Backend EC2
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.EC2_BACKEND_HOST }}
          username: ${{ secrets.EC2_USERNAME }}
          key: ${{ secrets.EC2_SSH_KEY }}
          script: |
            mkdir -p /app/emotion-aware-adaptive-math-learning-ai-ar
            cd /app/emotion-aware-adaptive-math-learning-ai-ar
            if [ ! -d .git ]; then
              git clone -b cloud https://github.com/fathurp01/emotion-aware-adaptive-math-learning-ai-ar.git .
            else
              git pull origin cloud
            fi
            export DOCKER_USERNAME=${{ secrets.DOCKER_USERNAME }}
            docker compose -f docker-compose.backend.yml pull
            docker compose -f docker-compose.backend.yml down
            docker compose -f docker-compose.backend.yml up -d
            docker compose -f docker-compose.backend.yml exec -T backend npx prisma db push
            docker compose -f docker-compose.backend.yml exec -T backend npx prisma db seed

      - name: Deploy Frontend to Frontend EC2
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.EC2_FRONTEND_HOST }}
          username: ${{ secrets.EC2_USERNAME }}
          key: ${{ secrets.EC2_SSH_KEY }}
          script: |
            mkdir -p /app/emotion-aware-adaptive-math-learning-ai-ar
            cd /app/emotion-aware-adaptive-math-learning-ai-ar
            if [ ! -d .git ]; then
              git clone -b cloud https://github.com/fathurp01/emotion-aware-adaptive-math-learning-ai-ar.git .
            else
              git pull origin cloud
            fi
            export DOCKER_USERNAME=${{ secrets.DOCKER_USERNAME }}
            export BACKEND_PRIVATE_IP=${{ secrets.EC2_BACKEND_PRIVATE_IP }}
            export FRONTEND_PUBLIC_DOMAIN=${{ secrets.FRONTEND_PUBLIC_DOMAIN }}
            docker compose -f docker-compose.frontend.yml pull
            docker compose -f docker-compose.frontend.yml down
            docker compose -f docker-compose.frontend.yml up -d
